<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="deckTitle deckDesc">
  <title id="deckTitle">Boston Deck - Aaron Grace</title>
  <desc id="deckDesc">Original handheld illustration for Aaron Grace. The screen shows his GitHub profile: AI engineer, founder of BostonAi.io, now playing DinoClaw, with WorkBot, Motion, Canary, and Voidrunner in the library.</desc>

  <defs>
