      <stop offset="100%" stop-color="#000000" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="bumper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4656"/>
      <stop offset="40%" stop-color="#232833"/>
      <stop offset="100%" stop-color="#12151b"/>
    </linearGradient>
    <radialGradient id="stickFace" cx="38%" cy="32%" r="70%">
