      <stop offset="45%" stop-color="#1a9fff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1a9fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b4a" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff6b4a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyMetal" x1="0" y1="0" x2="0" y2="1">
